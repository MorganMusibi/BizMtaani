<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />

    <title>BizMtaani | Buy, Sell, Rent & Find Jobs in Kenya</title>

    <meta
      name="description"
      content="Buy, sell, rent and find local jobs anywhere in Kenya. BizMtaani connects sellers and buyers, from your area to countrywide."
    />

    <meta name="robots" content="index, follow" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme -->
    <meta name="theme-color" content="#F97316" />

    <!-- Android / PWA -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Apple / iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />
    <meta
      name="apple-mobile-web-app-title"
      content="BizMtaani"
    />

    <!-- BizMtaani App Icon -->
    <link
      rel="icon"
      type="image/png"
      href="/bizmtaani-icon.png"
    />

    <link
      rel="apple-touch-icon"
      href="/bizmtaani-icon.png"
    />

    <!-- Open Graph -->
    <meta property="og:title" content="BizMtaani | Buy, Sell, Rent & Find Jobs in Kenya" />

    <meta
      property="og:description"
      content="Buy, sell, rent and find local jobs anywhere in Kenya. BizMtaani connects sellers and buyers, from your area to countrywide."
    />

    <meta property="og:type" content="website" />

    <meta
      property="og:image"
      content="https://www.bizmtaani.site/bizmtaani-icon.png"
    />

    <!-- Twitter -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="BizMtaani | Buy, Sell, Rent & Find Jobs in Kenya"
    />

    <meta
      name="twitter:description"
      content="Buy, sell, rent and find local jobs anywhere in Kenya. BizMtaani connects sellers and buyers, from your area to countrywide."
    />

    <meta
      name="twitter:image"
      content="https://www.bizmtaani.site/bizmtaani-icon.png"
    />

    <!-- Google Fonts -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link rel="preconnect" href="https://firestore.googleapis.com" />
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" />

    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap"
      />
    </noscript>

    <style>
      html,
      body {
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
      }
    </style>
  </head>

  <body>
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(145deg, #047857 0%, #022C22 100%);
        opacity: 1;
        transition: opacity 250ms ease-out;
      }
      #boot-splash.fade-out {
        opacity: 0;
        /* Never let a faded-out splash block taps on the app beneath it */
        pointer-events: none;
      }
      #boot-splash svg { width: 96px; height: 96px; border-radius: 22px; }
      #boot-splash .bm-word {
        margin-top: 20px;
        font-family: 'Outfit', system-ui, sans-serif;
        font-weight: 900;
        font-size: 30px;
        color: white;
        letter-spacing: -0.5px;
      }
    </style>

    <div id="boot-splash">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#047857"/>
            <stop offset="100%" stop-color="#022C22"/>
          </linearGradient>
          <linearGradient id="saw" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FB923C"/>
            <stop offset="100%" stop-color="#EA580C"/>
          </linearGradient>
        </defs>
        <rect width="100" height="100" rx="22" fill="url(#sbg)"/>
        <path d="M14 40 L50 24 L86 40 L82 49 L18 49 Z" fill="url(#saw)"/>
        <rect x="18" y="47" width="64" height="34" rx="3" fill="white" opacity="0.97"/>
        <rect x="23" y="53" width="15" height="11" rx="2.5" fill="#D1FAE5"/>
        <rect x="43" y="55" width="14" height="26" rx="2" fill="#065F46"/>
        <rect x="62" y="53" width="15" height="11" rx="2.5" fill="#D1FAE5"/>
        <rect x="12" y="79" width="76" height="4" rx="2" fill="#F97316" opacity="0.45"/>
      </svg>
      <div class="bm-word">BizMtaani</div>
    </div>

    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
    <script>
      if (location.search.includes('debug=1')) {
        var erudaScript = document.createElement('script');
        erudaScript.src = 'https://cdn.jsdelivr.net/npm/eruda';
        erudaScript.onload = function () { eruda.init(); };
        document.body.appendChild(erudaScript);
      }
    </script>
  </body>
</html>
